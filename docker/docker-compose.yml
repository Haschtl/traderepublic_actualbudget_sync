services:
  tr-sync:
    image: ghcr.io/aielloine/traderepublic_actualbudget_sync:latest
    container_name: tr-actual-sync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Mode de fonctionnement : "production" pour le mode réel
      APP_MODE: production
      # Cron 5 champs pour le sync automatique. Vide = désactivé.
      SYNC_CRON: "0 1 * * *"
      # Optional : protège l'UI/API si les deux valeurs sont non vides
      BASIC_AUTH_USERNAME: ""
      BASIC_AUTH_PASSWORD: ""

      # ── Trade Republic ─────────────────────────────────────────────────────
      # Numéro de téléphone associé à votre compte Trade Republic (format international)
      TR_PHONE_NUMBER: "+33600000000"
      # Code PIN Trade Republic (4 chiffres)
      TR_PIN: "1234"
      # Chemin du fichier de cookies persistant (à l'intérieur du conteneur)
      TR_COOKIES_FILE: /data/pytr_cookies.json

      # ── Actual Budget ───────────────────────────────────────────────────────
      # URL de votre instance Actual Budget (sans slash final)
      ACTUAL_URL: "http://actual-budget:5006"
      # Mot de passe d'accès à Actual Budget
      ACTUAL_PASSWORD: "votre-mot-de-passe"
      # Mot de passe de chiffrement du fichier budget Actual (laissez vide si non chiffré)
      ACTUAL_ENCRYPTION_PASSWORD: ""
      # ID ou nom exact du fichier budget dans Actual
      # → Obtenez-le via GET /actual/files après le démarrage
      ACTUAL_BUDGET_ID: "Mon Budget"
      # Nom exact du compte dans lequel importer les transactions
      ACTUAL_ACCOUNT_NAME: "Trade Republic"
      # Optional : compte opposé pour importer dépôts/retraits comme transfers
      ACTUAL_TRANSFER_ACCOUNT_NAME: ""

    volumes:
      # Persistance des cookies Trade Republic entre les redémarrages
      - tr_data:/data

    # Optionnel : connexion au réseau de votre instance Actual Budget
    # networks:
    #   - actual_network

volumes:
  tr_data:

# Décommentez si Actual Budget tourne dans un autre compose sur le même serveur :
# networks:
#   actual_network:
#     external: true
#     name: actual_default
